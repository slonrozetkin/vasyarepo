<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ваше название — работа на строительных объектах</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--card:#fff;--tx:#0e1220;--mut:#5d6578;--bd:#e1e5ee;--ac:#1a56ff;--ok:#d7f24a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f131c;--card:#181d29;--tx:#eef1f8;--mut:#9aa3b8;--bd:#2a3142;--ac:#6b93ff}}
:root[data-theme="dark"]{--bg:#0f131c;--card:#181d29;--tx:#eef1f8;--mut:#9aa3b8;--bd:#2a3142;--ac:#6b93ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "MF Evolt Special",Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;padding:8px 0 16px}
.logo{background:var(--ok);color:#111;font-weight:800;border-radius:10px;padding:6px 10px}
header b{font-size:20px}
.hero{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:24px}
h1{margin:0 0 4px;font-size:clamp(26px,5vw,40px)}
.hero p{margin:0 0 16px;color:var(--mut)}
.sr{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 14px}
.sr input{flex:1;min-width:200px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 22px;font-weight:600}
.grid{display:grid;grid-template-columns:260px 1fr;gap:16px;margin-top:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
.box h3{margin:0 0 10px;font-size:16px}
.box label{display:flex;justify-content:space-between;align-items:center;padding:6px 0;cursor:pointer}
.box label span:first-child{display:flex;gap:8px;align-items:center}
.n{color:var(--mut);font-size:13px}
.box select{width:100%}
.top{display:flex;justify-content:space-between;color:var(--ac);font-weight:600;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:12px}
.card:hover{border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card h2{margin:0;font-size:19px}
.sal{color:var(--ac);font-weight:800;font-size:19px;white-space:nowrap}
.obj{color:var(--mut);margin:4px 0 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{border:1px solid var(--bd);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--mut)}
.d{color:var(--mut);margin:0 0 12px}
.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ap{background:transparent;color:var(--tx);border:2px solid #c9e32e;border-radius:12px;padding:9px 26px;font-weight:600}
.ap.done{background:var(--ok);color:#111;border-color:var(--ok);cursor:default}
.dt{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:40px}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--tx);max-width:420px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 4px}dialog form{display:grid;gap:10px;margin-top:12px}
.acts{display:flex;gap:8px;justify-content:flex-end}
.gh{background:transparent;border:1px solid var(--bd);border-radius:12px;padding:11px 18px;color:var(--tx)}
footer{color:var(--mut);font-size:13px;text-align:center;padding:24px 0}

h1,h2,.sal,header b,.logo,.box h3{font-family:"MF Evolt Special",Unbounded,Manrope,system-ui,sans-serif}
html{background:var(--bg)}body{background-color:var(--bg);background-image:radial-gradient(600px 300px at 90% -5%,#ff8a3d33,transparent),radial-gradient(500px 300px at 0% 10%,#1a56ff22,transparent);background-repeat:no-repeat;min-height:100vh}
.logo{transform:rotate(-6deg);box-shadow:0 4px 0 #0e1220;transition:transform .3s}.logo:hover{transform:rotate(6deg) scale(1.1)}
.hero{position:relative;overflow:hidden;border:0;color:#fff;background:linear-gradient(120deg,#1a56ff,#7a3cff 60%,#ff5fa2);box-shadow:0 18px 40px -18px #1a56ff}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#ffffff22;animation:fl 8s ease-in-out infinite}
.hero:before{width:220px;height:220px;right:-50px;top:-70px}.hero:after{width:120px;height:120px;right:160px;bottom:-50px;animation-delay:-4s;background:#d7f24a55}
@keyframes fl{50%{transform:translate(-18px,16px) scale(1.12)}}
.hero>*{position:relative;z-index:1}.hero p{color:#ffffffcc}h1{font-weight:700;letter-spacing:-.02em}
.hero input{background:#fff;color:#0e1220;border:0}
.hero .btn{background:var(--ok);color:#111;font-weight:800;transition:transform .15s}.hero .btn:hover{transform:translateY(-2px) rotate(-1deg)}
.box{transition:box-shadow .2s}.box:hover{box-shadow:0 10px 24px -14px #1a56ff88}
aside{position:sticky;top:12px;align-self:start}@media(max-width:760px){aside{position:static}}
.card{position:relative;animation:in .5s both;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(n+5){animation-delay:.2s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card:hover{transform:translateY(-4px) rotate(-.3deg);box-shadow:0 16px 30px -16px #1a56ff99}
.card:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:5px;border-radius:0 6px 6px 0;background:var(--cc,#1a56ff)}
.sal{background:var(--ok);color:#111;border-radius:12px;padding:4px 12px;font-size:17px}
.city{display:inline-block;background:var(--cc);color:#fff;border-radius:999px;padding:2px 11px;font-size:13px;font-weight:600;margin-left:4px}
.tag{background:var(--bg);transition:.15s}.tag:hover{border-color:var(--ac);color:var(--ac)}
.ap{transition:.18s}.ap:not(.done):hover{background:var(--ok);color:#111;transform:scale(1.05) rotate(-1deg)}
.ap.done{animation:pop .4s}@keyframes pop{50%{transform:scale(1.12)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="w">
<header><span class="logo">В.</span><b>Ваше название</b></header>
<section class="hero"><h1>Работа на строительных объектах</h1>
<p id="cnt"></p>
<div class="sr"><input id="q" placeholder="Профессия или объект, например «сварщик»"><button class="btn" onclick="render()">Найти</button></div></section>
<div class="grid"><aside>
<div class="box"><h3>Город</h3><div id="cities"></div></div>
<div class="box"><h3>Должность</h3><select id="pos" onchange="render()"></select></div>
<div class="box"><h3>Зарплата от</h3><select id="sal" onchange="render()"><option value="0">Любая</option><option value="100000">от 100 000 ₽</option><option value="120000">от 120 000 ₽</option><option value="150000">от 150 000 ₽</option></select></div>
</aside><main><div class="top"><span id="found"></span><span>🔥 Сначала новые</span></div><div id="list"></div></main></div>
<footer>Демо-версия: объекты и работодатели вымышлены. Отклики сохраняются только в вашем браузере.</footer></div>
<dialog id="dlg"><h3 id="dt"></h3><div class="n" id="ds"></div>
<form onsubmit="send(event)"><input id="nm" placeholder="Ваше имя" required><input id="ph" type="tel" placeholder="Телефон" required><input id="ex" placeholder="Опыт работы (необязательно)">
<div class="acts"><button type="button" class="gh" onclick="dlg.close()">Отмена</button><button class="btn">Откликнуться</button></div></form></dialog>
<script>
var J=[
{id:1,t:"Каменщик",o:"ЖК «Усть-Вымский квартал»",c:"Сыктывкар",e:"СтройСевер",s:95000,g:"30/30",tg:["Проживание","Питание","Без опыта"],d:"Кладка стен 9-этажных секций. Общежитие рядом с объектом, спецодежда бесплатно.",dt:"7 октября"},
{id:2,t:"Электромонтажник",o:"Школа на 1100 мест",c:"Сыктывкар",e:"КомиЭлектроМонтаж",s:110000,g:"45/15",tg:["Проживание","Проезд оплачивается"],d:"Прокладка кабельных линий, монтаж щитов. Опыт от 1 года.",dt:"7 октября"},
{id:3,t:"Сварщик",o:"Мост через р. Сысола",c:"Сыктывкар",e:"МостСтрой-11",s:140000,g:"60/30",tg:["Проживание","Питание","НАКС"],d:"Сварка металлоконструкций пролётного строения. Удостоверение НАКС обязательно.",dt:"6 октября"},
{id:4,t:"Монтажник",o:"ЖК «Невский простор»",c:"Санкт-Петербург",e:"Северо-Запад Девелопмент",s:120000,g:"30/30",tg:["Проживание","Питание","Проезд оплачивается"],d:"Монтаж каркаса и ограждающих конструкций. Работа от прямого работодателя.",dt:"7 октября"},
{id:5,t:"Разнорабочий",o:"Логистический комплекс «Парнас»",c:"Санкт-Петербург",e:"ПетроСклад",s:85000,g:"15/15",tg:["Без опыта","Проживание"],d:"Подсобные работы на площадке, уборка, подача материалов.",dt:"7 октября"},
{id:6,t:"Арматурщик",o:"Бизнес-центр «Нева Тауэр»",c:"Санкт-Петербург",e:"БалтСтройМонолит",s:130000,g:"45/45",tg:["Проживание","Питание"],d:"Вязка арматурных каркасов фундаментной плиты и колонн.",dt:"5 октября"},
{id:7,t:"Бетонщик",o:"ЖК «Парк Столица»",c:"Москва",e:"МосМонолитСтрой",s:125000,g:"30/30",tg:["Проживание","Питание","Без опыта"],d:"Укладка и уплотнение бетонной смеси. Обучение на объекте.",dt:"7 октября"},
{id:8,t:"Проходчик",o:"Станция метро «Троицкая»",c:"Москва",e:"Метроинжстрой",s:190000,g:"60/30",tg:["Проживание","Питание","Проезд оплачивается"],d:"Работа в тоннеле, механизированный щит. Опыт от 2 лет.",dt:"6 октября"},
{id:9,t:"Сантехник",o:"Многопрофильная больница",c:"Москва",e:"ИнжСистемы",s:115000,g:"45/15",tg:["Проживание","Спецодежда"],d:"Монтаж систем водоснабжения, отопления и канализации.",dt:"7 октября"},
{id:10,t:"Разнорабочий",o:"ТРЦ «Горизонт»",c:"Москва",e:"ГорСтройРесурс",s:95000,g:"15/15",tg:["Без опыта","Питание"],d:"Подсобные работы, разгрузка материалов, уборка площадки.",dt:"5 октября"}];
var CC={"Сыктывкар":"#12a36b","Санкт-Петербург":"#7a3cff","Москва":"#ff5a3c"},CT=["Сыктывкар","Санкт-Петербург","Москва"],sel={},app={};
try{app=JSON.parse(localStorage.getItem("apps")||"{}")}catch(e){}
var $=function(i){return document.getElementById(i)},cur=null;
var cb=$("cities");CT.forEach(function(c){var n=J.filter(function(j){return j.c==c}).length;
cb.insertAdjacentHTML("beforeend",'<label><span><input type="checkbox" value="'+c+'" onchange="render()">'+c+'</span><span class="n">'+n+'</span></label>')});
var ps=[];J.forEach(function(j){if(ps.indexOf(j.t)<0)ps.push(j.t)});ps.sort();
$("pos").innerHTML='<option value="">Любая</option>'+ps.map(function(p){return"<option>"+p+"</option>"}).join("");
$("q").addEventListener("keydown",function(e){if(e.key=="Enter")render()});
function fm(n){return String(n).replace(/\B(?=(\d{3})+$)/g," ")}
function render(){
var cs=[].slice.call(cb.querySelectorAll("input:checked")).map(function(i){return i.value}),p=$("pos").value,q=$("q").value.toLowerCase().trim();
var sm=+$("sal").value;
var r=J.filter(function(j){return(!cs.length||cs.indexOf(j.c)>=0)&&(!p||j.t==p)&&j.s>=sm&&(!q||(j.t+" "+j.o+" "+j.e).toLowerCase().indexOf(q)>=0)});
$("found").textContent="Найдено "+r.length+" "+(r.length==1?"вакансия":"вакансий");
$("cnt").textContent=J.length+" актуальных вакансий на объектах в Сыктывкаре, Санкт-Петербурге и Москве";
$("list").innerHTML=r.length?r.map(function(j){var d=app[j.id];
return'<div class="card" style="--cc:'+CC[j.c]+'"><div class="row"><h2>'+j.t+'</h2><span class="sal">от '+fm(j.s)+' ₽ / месяц</span></div>'+
'<div class="obj">🏗 <b>'+j.o+'</b> <span class="city">'+j.c+'</span> · '+j.e+' · график '+j.g+'</div>'+
'<div class="tags">'+j.tg.map(function(t){return'<span class="tag">'+t+'</span>'}).join("")+'</div>'+
'<p class="d">'+j.d+'</p><div class="foot">'+(d?'<button class="ap done">Отклик отправлен ✓</button>':'<button class="ap" onclick="op('+j.id+')">Откликнуться</button>')+
'<span class="dt">Вакансия опубликована '+j.dt+' 2026 г.</span></div></div>'}).join(""):'<div class="empty">По вашему запросу ничего не найдено</div>'}
function op(id){cur=J.filter(function(j){return j.id==id})[0];$("dt").textContent=cur.t;$("ds").textContent=cur.o+", "+cur.c;$("dlg").showModal()}
function send(e){e.preventDefault();app[cur.id]={n:$("nm").value,p:$("ph").value,x:$("ex").value};
try{localStorage.setItem("apps",JSON.stringify(app))}catch(x){}
$("dlg").close();e.target.reset();render()}
render();
</script></body></html>
